<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tablero de supervisión</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
:root{--bg:#eef0f3;--panel:#fff;--ink:#14181f;--ink2:#4a5360;--ink3:#7a8493;--line:#dde1e7;--soft:#f4f6f9;--accent:#1f5fbf;--acbg:#e6eefb;
 --c0:#2a78d6;--c1:#eb6834;--c2:#0d9488;--ok:#0f7a4a;--okbg:#e2f3ea;--rest:#8a5a00;--restbg:#fdf1d8;
 --font:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;--num:'Barlow Condensed','Arial Narrow',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--panel:#171b22;--ink:#eef1f5;--ink2:#b5bdc9;--ink3:#8a94a3;--line:#2a303a;--soft:#1d222b;--accent:#6aa5f0;--acbg:#1c2a40;
 --c0:#3987e5;--c1:#e0652f;--c2:#2dd4bf;--ok:#4cc790;--okbg:#16352a;--rest:#f5b84a;--restbg:#3a2c12;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--font)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;margin-bottom:18px}
.kick{font-family:var(--num);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
h1{font-family:var(--num);font-weight:700;font-size:34px;line-height:1;margin:4px 0 0;text-transform:uppercase;letter-spacing:.01em}
.upd{font-size:13px;color:var(--ink3)}
.step{font-family:var(--num);font-size:15px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:6px 0 12px}
/* Paso 1 */
.cuads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cu{font:inherit;text-align:left;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--cc);border-radius:10px;padding:18px 18px 16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:transform .15s,box-shadow .15s}
.cu:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(15,23,42,.14)}
.cu:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.cu .rn{font-family:var(--num);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.cu .rn b{display:block;font-size:64px;line-height:.9;color:var(--cc);letter-spacing:0}
.st{align-self:flex-start;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--okbg);color:var(--ok)}
.st.rest{background:var(--restbg);color:var(--rest)}
.cu .dt{font-size:13px;color:var(--ink3)}
.cu .tot{font-family:var(--num);font-size:28px;font-weight:700;line-height:1}.cu .tot small{font-family:var(--font);font-size:13px;font-weight:500;color:var(--ink3);margin-left:4px}
.cu .go{margin-top:2px;font-weight:600;color:var(--accent);font-size:14px}
/* Paso 2 */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:16px}
.sel{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;background:var(--panel);border:1px solid var(--line);border-radius:99px}
.sel i{font-style:normal;font-family:var(--num);font-weight:700;font-size:20px;color:#fff;background:var(--cc);border-radius:99px;min-width:40px;height:34px;display:grid;place-items:center;padding:0 8px}
.sel b{font-weight:600}.sel span{color:var(--ink3);font-size:13px}
.btn{font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible,.q:focus-visible,.chips button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{font:inherit;flex:1;min-width:200px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.chips button{font:inherit;font-size:13px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);cursor:pointer}
.chips button b{font-weight:600;color:var(--ink);margin-left:4px}
.chips button:hover{border-color:var(--accent)}
.sum{font-size:14px;color:var(--ink2);margin:-4px 0 12px}
.grid{columns:3 330px;column-gap:14px}
.grp{break-inside:avoid;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:0 0 14px;overflow:hidden;scroll-margin-top:90px}
.grp h2{margin:0;display:flex;align-items:baseline;gap:10px;padding:12px 16px;background:var(--soft);border-bottom:1px solid var(--line);font-family:var(--num);font-size:21px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.grp h2 span{margin-left:auto;font-family:var(--font);font-size:13px;font-weight:600;color:var(--ink3);text-transform:none;letter-spacing:0}
.lead{padding:8px 16px;font-size:13px;color:var(--ink2);border-bottom:1px solid var(--line)}.lead b{color:var(--ink)}
.cat{padding:10px 16px 8px}.cat+.cat{border-top:1px dashed var(--line)}
.cat h3{margin:0 0 6px;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:flex;gap:8px}
.cat h3 small{color:var(--ink3);font-weight:500}
.cat ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.cat li{display:flex;gap:10px;align-items:baseline;font-size:15px}
.cat li .nn{font-family:var(--num);font-size:13px;color:var(--ink3);min-width:16px;text-align:right}
mark{background:#fde68a;color:inherit;border-radius:2px;padding:0 1px}
.empty{padding:30px;text-align:center;color:var(--ink3);background:var(--panel);border:1px dashed var(--line);border-radius:10px}
footer{margin-top:22px;font-size:12.5px;color:var(--ink3);line-height:1.5}
[hidden]{display:none!important}
@media (max-width:760px){.bar{position:static}.cuads{grid-template-columns:1fr}.cu{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 14px}.cu .rn b{font-size:46px}.cu .rn{min-width:96px}.cu .dt{flex-basis:100%}h1{font-size:28px}.grid{columns:1}}
@media (prefers-reduced-motion:reduce){.cu{transition:none}.cu:hover{transform:none}}
</style>
</head>

const CU=[{i:1,n:'I',c:'var(--c1)'},{i:0,n:'II',c:'var(--c0)'},{i:2,n:'III',c:'var(--c2)'}];
const turno=i=>{const t=nz(D.turn[i]);return t.startsWith('1ER')?'1er. turno':t.startsWith('2D')?'2do. turno':t.startsWith('DESC')?'Descanso':tc(D.turn[i])};
const fechas=i=>{const p=[];if(D.ini&&D.ini[i])p.push('inicia '+D.ini[i]);if(D.fin&&D.fin[i])p.push('termina '+D.fin[i]);if(D.desc&&D.desc[i])p.push('descansa '+D.desc[i]);return p.join(' · ')};
const total=i=>D.groups.reduce((a,g)=>a+g.rows.filter(r=>r.n[i]).length,0);

$('upd').textContent=`Pueble actualizado el ${D.fecha||'—'} · periodo ${D.periodo||'—'}`;
$('ft').textContent=`Fuente: PUEBLE ARANZAZU.xlsx, hoja OPERACIONES (actualizada el ${D.fecha||'—'}). Se muestra el personal asignado a cada cuadrilla; no aparecen vacantes, Stand by ni canceladas.`;

$('cuads').innerHTML=CU.map(c=>{const t=turno(c.i),rest=/Descanso/i.test(t);
 return `<button class="cu" type="button" data-i="${c.i}" style="--cc:${c.c}"><div class="rn">Cuadrilla<b>${c.n}</b></div><span class="st${rest?' rest':''}">${esc(rest?'Descanso':'En turno · '+t)}</span><div class="dt">${esc(fechas(c.i))}</div><div class="tot">${total(c.i)}<small>personas</small></div><div class="go">Ver personal →</div></button>`}).join('');

let CUR=null;
function groupsFor(i,q){
 return D.groups.map((g,gi)=>{const cats=[];g.rows.forEach(r=>{const n=r.n[i];if(!n)return;if(q&&!nz(n).includes(q)&&!nz(r.c).includes(q))return;
   let c=cats.find(x=>x.c===nz(r.c));if(!c){c={c:nz(r.c),l:tc(r.c),n:[]};cats.push(c)}c.n.push(n)});
  return {gi,g:tc(g.g),lead:g.lead&&g.lead[i]?g.lead[i]:null,cats,tot:cats.reduce((a,c)=>a+c.n.length,0)}}).filter(x=>x.tot);
}
function hl(s,q){const t=tc(s);if(!q)return esc(t);const k=nz(t),at=k.indexOf(q);return at<0?esc(t):esc(t.slice(0,at))+'<mark>'+esc(t.slice(at,at+q.length))+'</mark>'+esc(t.slice(at+q.length))}
function render(){
 const i=CUR,c=CU.find(x=>x.i===i),q=nz($('q').value);
 $('sel').style.setProperty('--cc',c.c);
 $('sel').innerHTML=`<i>${c.n}</i><div><b>Cuadrilla ${c.n}</b> <span>· ${esc(turno(i))}${fechas(i)?' · '+esc(fechas(i)):''}</span></div>`;
 const G=groupsFor(i,q),n=G.reduce((a,g)=>a+g.tot,0);
 $('sum').textContent=q?`${n} ${n===1?'persona':'personas'} con «${$('q').value.trim()}»`:`${n} personas en ${G.length} grupos de Operaciones`;
 $('chips').innerHTML=q?'':G.map(g=>`<button type="button" data-g="${g.gi}">${esc(g.g)}<b>${g.tot}</b></button>`).join('');
 $('grid').innerHTML=G.length?G.map(g=>`<article class="grp" id="g${g.gi}"><h2>${esc(g.g)}<span>${g.tot} ${g.tot===1?'persona':'personas'}</span></h2>${g.lead?`<div class="lead">A cargo: <b>${esc(tc(g.lead))}</b></div>`:''}${g.cats.map(ct=>`<div class="cat"><h3>${esc(ct.l)}<small>${ct.n.length}</small></h3><ol>${ct.n.map((x,k)=>`<li><span class="nn">${k+1}</span><span>${hl(x,q)}</span></li>`).join('')}</ol></div>`).join('')}</article>`).join(''):'<div class="empty">Sin resultados en esta cuadrilla.</div>';
}
function show(i,push){
 if(i==null){CUR=null;$('s1').hidden=false;$('s2').hidden=true;if(push)setHash('');return}
 CUR=i;$('q').value='';$('s1').hidden=true;$('s2').hidden=false;render();window.scrollTo(0,0);if(push)setHash('cuadrilla-'+CU.find(x=>x.i===i).n.toLowerCase());
}
function setHash(h){try{history.replaceState(null,'',h?'#'+h:location.pathname+location.search)}catch(e){location.hash=h}}
function fromHash(){const m=(location.hash||'').match(/^#cuadrilla-(i{1,3})$/i);const c=m&&CU.find(x=>x.n===m[1].toUpperCase());show(c?c.i:null,false)}
$('cuads').addEventListener('click',e=>{const b=e.target.closest('.cu');if(b)show(+b.dataset.i,true)});
$('back').addEventListener('click',()=>show(null,true));
$('q').addEventListener('input',render);
$('chips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const el=$('g'+b.dataset.g);if(el)el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'})});
window.addEventListener('hashchange',fromHash);
fromHash();
})();
</script>
</body>
</html>
